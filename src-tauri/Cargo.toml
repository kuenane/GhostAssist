[package]
name = "ghostassist"
version = "1.0.0"
description = "Undetectable desktop AI assistant for meetings and interviews"
authors = ["GhostAssist"]
edition = "2021"

[lib]
name = "ghostassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
keyring = "1.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
